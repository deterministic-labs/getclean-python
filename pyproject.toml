[project]
name = "getclean"
version = "0.1.0"
description = "The official Python SDK for getclean, the data layer for research agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Deterministic Labs", email = "support@getclean.ai" },
]
keywords = [
    "getclean",
    "sdk",
    "api-client",
    "research-agents",
    "web-data",
    "python"
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.18.2,<3.0.0",
    "typing_extensions>=4.0.0"
]

[project.optional-dependencies]
aiohttp = [
    "aiohttp>=3.14.1,<4; python_version >= \"3.10\"",
    "httpx-aiohttp>=0.1.8,<0.2.0; python_version >= \"3.10\""
]

[project.urls]
Homepage = "https://getclean.ai"
Documentation = "https://docs.getclean.ai"
Source = "https://github.com/deterministic-labs/getclean-python"
Issues = "https://github.com/deterministic-labs/getclean-python/issues"
Changelog = "https://github.com/deterministic-labs/getclean-python/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [
    { include = "getclean", from = "src"}
]

[tool.poetry.group.dev.dependencies]
mypy = "==1.13.0"
pytest = "^9.0.3"
pytest-asyncio = "^1.0.0"
pytest-xdist = "^3.6.1"
python-dateutil = "^2.9.0"
types-python-dateutil = "^2.9.0.20240316"
urllib3 = ">=2.6.3,<3.0.0"
ruff = "==0.11.5"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_mode = "auto"
norecursedirs = [ "src" ]
markers = [
    "aiohttp: tests that require httpx_aiohttp to be installed",
]

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
]
# The rules this generator's own output breaks, each where it does; a rule the output keeps is not ignored.
ignore = [
    "E402",  # the pydantic version imports come after the version check that chooses them
    "E501",  # docstrings and samples carry the API's own text as written; the formatter wraps code, not text
    "E721",  # the serialization layer compares types with ==
    "E722",  # the pydantic compatibility layer catches with a bare except
    "E731",  # the raw client assigns lambdas
    "F841",  # the serialization layer leaves an assigned name unused
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party"]

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"
