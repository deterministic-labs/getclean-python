name: Publish

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Refuse to publish from a private repository
        # The release environment's required review is enforced on public repositories; a tag pushed while the
        # repository is still private would publish with no review.
        run: test "${{ github.event.repository.private }}" = "false" || { echo "the repository is private; publish only from the public repository"; exit 1; }
      - name: Check that the tag names the version being built
        run: |
          version="$(ls dist/*.tar.gz | sed -E 's|.*/getclean-(.+)\.tar\.gz|\1|')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "the tag $GITHUB_REF_NAME does not name the package version $version"; exit 1; }
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { on = index($0, "## " v " ") == 1 || $0 == "## " v }
            on && !/^## / { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no entry for $version"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            notes.md
          if-no-files-found: error

  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[aiohttp]"
          python -m pip install mypy==1.13.0 ruff==0.11.5 pytest==9.1.1 pytest-asyncio==1.4.0 pytest-xdist==3.8.0 python-dateutil==2.9.0.post0 types-python-dateutil==2.9.0.20260807 urllib3==2.8.0
      - name: Lint, type check and test
        run: |
          ruff check src tests
          mypy src
          pytest -q

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/getclean
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      # The artifact holds dist/ and notes.md; the action publishes what stands under dist/.
      # Trusted publishing: the job's OIDC token is exchanged for a short-lived upload token; no secret is stored.
      # Attestations and the metadata check are the action's defaults.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
